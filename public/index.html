<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuroki Spare Parts Catalog</title>
  <link rel="icon" type="image/png" href="images/kuroki-logo.png" />
  <link rel="apple-touch-icon" href="images/kuroki-logo.png" />
  <meta property="og:title" content="Kuroki Spare Parts Catalog" />
  <meta property="og:description" content="Laser Printer &amp; Copier Spare Parts Catalog" />
  <meta property="og:image" content="images/kuroki-logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand-title">
        <img src="images/kuroki-logo.png" alt="Kuroki Logo" class="brand-logo" />
        <div>
          <h1>Kuroki Spare Parts Catalog</h1>
          <p id="catalogMeta" class="meta-text">Loading catalog...</p>
        </div>
      </div>
      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="Search by OEM No, Item No, machine model, or keyword..."
          autocomplete="off"
        />
        <button id="clearAllBtn" class="btn-secondary" type="button">Reset</button>
      </div>
    </div>
  </header>

  <nav class="segment-bar">
    <div class="container">
      <button id="mobileSegmentToggle" class="mobile-filter-toggle" type="button" aria-expanded="false">
        <span id="mobileSegmentLabel">Parts Type: All Parts</span>
        <span id="mobileSegmentArrow">▾ Show</span>
      </button>
    </div>
    <div class="container segment-tabs" id="segmentTabs"></div>
  </nav>

  <main class="container layout">
    <aside class="sidebar">
      <button id="mobileFilterToggle" class="mobile-filter-toggle" type="button" aria-expanded="false">
        <span id="mobileFilterLabel">Filters: Brand &amp; Machine Model</span>
        <span id="mobileFilterArrow">▾ Show</span>
      </button>
      <div id="sidebarFilters" class="sidebar-filters">
        <section class="filter-panel">
          <div class="panel-header">
            <h2>1. Brand</h2>
            <span id="brandCount" class="count-pill">0</span>
          </div>
          <input id="brandFilterInput" type="search" class="mini-search" placeholder="Filter brands..." />
          <ul id="brandList" class="filter-list"></ul>
        </section>

        <section class="filter-panel">
          <div class="panel-header">
            <h2>2. Machine Model</h2>
          </div>
          <input id="modelFilterInput" type="search" class="mini-search" style="margin-bottom:0" placeholder="Enter model (e.g. C250, 250)..." />
        </section>
      </div>
    </aside>

    <section class="content">
      <div class="results-bar">
        <div id="activeBreadcrumb" class="breadcrumb">All Products</div>
        <div class="results-controls">
          <label class="checkbox-label">
            <input type="checkbox" id="withImageOnly" />
            With photo only
          </label>
          <span id="resultsCount" class="results-count">0 parts</span>
        </div>
      </div>

      <div id="partsGrid" class="parts-grid"></div>

      <div id="paginationBar" class="pagination-bar"></div>
    </section>
  </main>

  <!-- Product Detail / Image Lightbox Modal -->
  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
