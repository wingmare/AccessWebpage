<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview — Kuroki Spare Parts Catalog</title>
  <link rel="icon" type="image/png" href="images/kuroki-logo.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      gap: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .toolbar h1 {
      margin: 0 10px 0 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .size-btn, .pc-link {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #334155;
      color: #f8fafc;
      font-size: 0.84rem;
      cursor: pointer;
      text-decoration: none;
    }
    .size-btn.active {
      background: #0284c7;
      border-color: #0284c7;
    }
    .phone-frame {
      background: #020617;
      padding: 14px;
      border-radius: 34px;
      border: 3px solid #475569;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    iframe {
      display: block;
      border: none;
      border-radius: 22px;
      background: #f4f6f9;
      transition: width 0.2s ease, height 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Mobile Preview</h1>
    <button class="size-btn" data-w="375" data-h="667">375×667 (SE)</button>
    <button class="size-btn active" data-w="390" data-h="844">390×844 (Standard)</button>
    <button class="size-btn" data-w="430" data-h="932">430×932 (Large)</button>
    <select id="langSelect" class="size-btn" title="Simulate visitor browser language">
      <option value="">Lang: Browser Default</option>
      <option value="en-US">Lang: English (en-US)</option>
      <option value="zh-TW">Lang: Traditional Chinese (zh-TW)</option>
      <option value="zh-CN">Lang: Simplified Chinese (zh-CN)</option>
      <option value="ja-JP">Lang: Japanese (ja-JP)</option>
      <option value="de-DE">Lang: German (de-DE)</option>
      <option value="ko-KR">Lang: Korean (ko-KR)</option>
    </select>
    <a class="pc-link" href="index.html">Open Full PC View ↗</a>
  </div>

  <div class="phone-frame">
    <iframe id="previewFrame" src="index.html" width="390" height="844" title="Mobile Catalog Preview"></iframe>
  </div>

  <script>
    const frame = document.getElementById("previewFrame");
    document.querySelectorAll(".size-btn[data-w]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn[data-w]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        frame.width = btn.dataset.w;
        frame.height = btn.dataset.h;
      });
    });

    document.getElementById("langSelect").addEventListener("change", (e) => {
      const lang = e.target.value;
      frame.src = lang ? `./?lang=${encodeURIComponent(lang)}` : "./";
    });
  </script>
</body>
</html>
